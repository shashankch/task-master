spring:
  application:
    name: taskmaster
  profiles:
    active: dev
  main:
    allow-bean-definition-overriding: true
  threads:
    virtual:
      enabled: true

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 20
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 15MB

server:
  port: 8080
  shutdown: graceful
  error:
    include-message: always
    include-binding-errors: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true

# Custom App Properties
app:
  jwt:
    issuer: taskmaster-auth-service
    access-token-expiration-minutes: 15
    refresh-token-expiration-days: 7
    public-key-path: classpath:certs/public.pem
    private-key-path: classpath:certs/private.pem
  rate-limiting:
    enabled: true
    auth-requests-per-minute: 5
    general-requests-per-minute: 100
  storage:
    type: minio
    s3:
      endpoint: http://localhost:9000
      region: us-east-1
      bucket-name: taskmaster-attachments
      access-key: minioadmin
      secret-key: minioadmin
      path-style-access-enabled: true
      presigned-url-expiration-minutes: 15
