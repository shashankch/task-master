spring:
  application:
    name: taskmaster
  profiles:
    active: dev
  threads:
    virtual:
      enabled: true

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 20
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 15MB

  web:
    error:
      include-message: always
      include-binding-errors: always

server:
  port: 8080
  forward-headers-strategy: FRAMEWORK
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true

# Custom App Properties
app:
  jwt:
    issuer: taskmaster-auth-service
    access-token-expiration-minutes: 15
    refresh-token-expiration-days: 7
    public-key-path: classpath:certs/public.pem
    private-key-path: classpath:certs/private.pem
  cors:
    allowed-origins:
      - http://localhost:3000
      - http://localhost:5173
      - http://localhost:8080
  rate-limiting:
    enabled: true
    auth-requests-per-minute: 5
    general-requests-per-minute: 100
  storage:
    type: minio
    s3:
      endpoint: http://localhost:9000
      region: us-east-1
      bucket-name: taskmaster-attachments
      access-key: minioadmin
      secret-key: minioadmin
      path-style-access-enabled: true
      presigned-url-expiration-minutes: 15
  ai:
    enabled: ${AI_ENABLED:true}
    base-url: ${AI_BASE_URL:https://api.groq.com/openai/v1}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:llama-3.3-70b-versatile}
    temperature: ${AI_TEMPERATURE:0.2}
    timeout-seconds: ${AI_TIMEOUT_SECONDS:10}
    fallback-enabled: ${AI_FALLBACK_ENABLED:true}
