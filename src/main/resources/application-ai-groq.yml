spring:
  config:
    activate:
      on-profile: ai-groq

  ai:
    openai:
      base-url: https://api.groq.com/openai/v1
      api-key: ${GROQ_API_KEY:}
      chat:
        options:
          model: llama-3.3-70b-versatile
          temperature: 0.7

app:
  ai:
    provider: groq
    default-model: llama-3.3-70b-versatile
    timeout-seconds: 30
