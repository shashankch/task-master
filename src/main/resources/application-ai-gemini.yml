spring:
  config:
    activate:
      on-profile: ai-gemini

  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY:}
        chat:
          options:
            model: gemini-2.5-flash
            temperature: 0.7
            max-output-tokens: 2048

app:
  ai:
    provider: gemini
    default-model: gemini-2.5-flash
    timeout-seconds: 30
