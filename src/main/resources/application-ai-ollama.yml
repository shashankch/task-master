spring:
  config:
    activate:
      on-profile: ai-ollama

  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        model: llama3.2
        options:
          temperature: 0.7

app:
  ai:
    provider: ollama
    default-model: llama3.2
    timeout-seconds: 60
